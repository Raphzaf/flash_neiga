services:
  - type: web
    name: flash-neiga-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: flash-neiga-db
          property: connectionString
      - key: HYP_TERMINAL_ID
        value: "4502176330"
      - key: HYP_USER_ID
        value: "pveda"
      - key: HYP_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: HYP_PASSP
        sync: false  # Terminal API password (PassP); set manually in Render dashboard
      - key: HYP_API_URL
        value: "https://icom.yaad.net/p/"
      - key: HYP_REQUIRE_SIGNATURE
        value: "false"  # Set to "true" once the terminal signs its notifications
      - key: HYP_SUCCESS_URL
        value: "https://app.flash-neiga.com/payment/success"
      - key: HYP_ERROR_URL
        value: "https://app.flash-neiga.com/payment/failure"
      - key: HYP_CALLBACK_URL
        value: "https://flash-neiga-backend.onrender.com/api/payments/hyp/callback"
      - key: ALLOWED_ORIGINS
        value: "https://app.flash-neiga.com,https://appflashneiga.netlify.app"
      # ===== Coach IA — Google AI / Gemini =====
      - key: AI_PROVIDER
        value: "gemini"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"   # ou gemini-2.5-pro pour plus de qualité
      - key: GEMINI_API_KEY
        sync: false  # clé Google AI Studio — à définir dans le dashboard Render
      # Alternative Vertex AI (au lieu de la clé AI Studio) :
      # - key: GOOGLE_GENAI_USE_VERTEXAI
      #   value: "true"
      # - key: GOOGLE_CLOUD_PROJECT
      #   value: "239164849877"
      # - key: GOOGLE_CLOUD_LOCATION
      #   value: "europe-west1"
      # ===== Coach IA — Kimi / Moonshot AI (alternative) =====
      # Pour basculer sur Kimi : mettre AI_PROVIDER=moonshot ci-dessus.
      - key: MOONSHOT_BASE_URL
        value: "https://api.moonshot.ai/v1"
      - key: MOONSHOT_MODEL
        value: "kimi-k3"   # kimi-k2.7-code | kimi-k2.6 | kimi-k2.5 (moins chers)
      - key: MOONSHOT_API_KEY
        sync: false  # SECRET — à saisir dans le dashboard Render, jamais dans ce fichier
      - key: ADMIN_TOKEN
        sync: false  # protège /api/admin/* (dont la synthèse des questions pièges)
      - key: ADMIN_EMAILS
        value: "admin@gmail.com"  # comptes autorisés sur le CMS et le CRM (séparés par des virgules)

databases:
  - name: flash-neiga-db
    databaseName: flash_neiga
    user: flash_neiga_user
    plan: free
