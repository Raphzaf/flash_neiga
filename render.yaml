services:
  - type: web
    name: flash-neiga-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: flash-neiga-db
          property: connectionString
      - key: HYP_TERMINAL_ID
        value: "4502176330"
      - key: HYP_USER_ID
        value: "pveda"
      - key: HYP_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: HYP_PASSP
        sync: false  # Terminal API password (PassP); set manually in Render dashboard
      - key: HYP_API_URL
        value: "https://icom.yaad.net/p/"
      - key: HYP_REQUIRE_SIGNATURE
        value: "false"  # Set to "true" once the terminal signs its notifications
      - key: HYP_SUCCESS_URL
        value: "https://appflashneiga.netlify.app/payment/success"
      - key: HYP_ERROR_URL
        value: "https://appflashneiga.netlify.app/payment/failure"
      - key: HYP_CALLBACK_URL
        value: "https://flash-neiga-backend.onrender.com/api/payments/hyp/callback"
      - key: ALLOWED_ORIGINS
        value: "https://appflashneiga.netlify.app,https://flash-neiga.netlify.app"

databases:
  - name: flash-neiga-db
    databaseName: flash_neiga
    user: flash_neiga_user
    plan: free
