services:
  - type: web
    name: flash-neiga-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: flash-neiga-db
          property: connectionString
      - key: HYP_TERMINAL_ID
        value: "4502176330"
      - key: HYP_USER_ID
        value: "pveda"
      - key: HYP_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: HYP_PASSP
        sync: false  # Terminal API password (PassP); set manually in Render dashboard
      - key: HYP_API_URL
        value: "https://icom.yaad.net/p/"
      - key: HYP_REQUIRE_SIGNATURE
        value: "false"  # Set to "true" once the terminal signs its notifications
      - key: HYP_SUCCESS_URL
        value: "https://app.flash-neiga.com/payment/success"
      - key: HYP_ERROR_URL
        value: "https://app.flash-neiga.com/payment/failure"
      - key: HYP_CALLBACK_URL
        value: "https://flash-neiga-backend.onrender.com/api/payments/hyp/callback"
      - key: ALLOWED_ORIGINS
        value: "https://app.flash-neiga.com,https://appflashneiga.netlify.app"
      # ===== Coach IA (Claude) =====
      # Mode Google Cloud Vertex AI (le projet fournit une credential GCP).
      # Définir aussi l'auth GCP : GOOGLE_APPLICATION_CREDENTIALS (JSON de compte
      # de service) OU GOOGLE_APPLICATION_CREDENTIALS_JSON selon ton setup Render.
      - key: ANTHROPIC_VERTEX_PROJECT_ID
        sync: false  # ex: 239164849877 — à définir dans le dashboard Render
      - key: CLOUD_ML_REGION
        sync: false  # région Vertex où claude-opus-4-8 est activé (ex: europe-west1)
      # Alternative API première partie (si tu utilises une clé sk-ant-... à la place) :
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      - key: ADMIN_TOKEN
        sync: false  # protège /api/admin/* (dont la synthèse des questions pièges)

databases:
  - name: flash-neiga-db
    databaseName: flash_neiga
    user: flash_neiga_user
    plan: free
