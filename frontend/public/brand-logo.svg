<?xml version="1.0" encoding="UTF-8"?>
<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flash Neiga logo">
  <defs>
    <!-- Light blue gradient for circle background -->
    <linearGradient id="bg" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60C5FF"/>
      <stop offset="0.5" stop-color="#3B9EFF"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
    <!-- Yellow gradient for lightning bolt -->
    <linearGradient id="bolt" x1="28" y1="12" x2="44" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="0.5" stop-color="#FFC107"/>
      <stop offset="1" stop-color="#FFA000"/>
    </linearGradient>
    <!-- Soft glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with light blue gradient -->
  <circle cx="36" cy="36" r="32" fill="url(#bg)"/>

  <!-- Lightning bolt with yellow gradient and glow -->
  <path d="M42 12 L26 36 L34 36 L30 60 L50 32 L40 32 Z" fill="url(#bolt)" filter="url(#glow)" stroke="#F57F17" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- Highlight on bolt for 3D effect -->
  <path d="M40 14 L28 34 L33 34" fill="none" stroke="#FFECB3" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
